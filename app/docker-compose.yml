version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: barflow-db
    restart: always
    environment:
      POSTGRES_USER: barflow_user
      POSTGRES_PASSWORD: barflow_password
      POSTGRES_DB: barflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
